```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - NovaTech</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">


    <!-- Navigation -->

    <header>

        <nav class="navbar">

            <a href="index.html" class="logo">
                NovaTech
            </a>

            <a href="index.html" class="back-home">
                ← Home
            </a>

        </nav>

    </header>


    <!-- Login -->

    <main class="login-container">

        <div class="login-box">

            <div class="login-header">

                <div class="login-icon">
                    🔐
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to your NovaTech account
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label>
                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


                <p id="loginMessage"></p>

            </form>


            <div class="signup-text">

                Don't have an account?

                <a href="#">
                    Sign Up
                </a>

            </div>

        </div>

    </main>


    <footer>

        <p>
            © 2026 NovaTech. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
```
